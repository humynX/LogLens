[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens"
version = "0.1.0"
description = "AI-Powered Security Log Analysis - Natural language queries for security logs"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "HUMYNX", email = "contact@humynx.com"}
]
maintainers = [
    {name = "HUMYNX", email = "contact@humynx.com"}
]
keywords = [
    "security",
    "log-analysis",
    "cybersecurity",
    "llm",
    "natural-language",
    "threat-hunting",
    "siem",
    "anomaly-detection",
    "mitre-attack"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
]
ml = [
    "scikit-learn>=1.0.0",
    "numpy>=1.21.0",
]
all = [
    "loglens[dev,ml]",
]

[project.scripts]
loglens = "loglens.cli:main"

[project.urls]
Homepage = "https://github.com/humynx/loglens"
Documentation = "https://github.com/humynx/loglens#readme"
Repository = "https://github.com/humynx/loglens"
Issues = "https://github.com/humynx/loglens/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["loglens*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
